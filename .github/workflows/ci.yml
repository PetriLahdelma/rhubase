name: Local checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Local verification
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Select the pinned Rust toolchain
        run: rustup show
      - name: Install the pinned compiler without package scripts
        run: npm ci --ignore-scripts
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Verify source, docs, and unit behavior
        run: npm run verify
      - name: Verify the CLI and process boundaries
        run: npm run test:cli
      - name: Run the local learning example
        run: npm run example:assess
